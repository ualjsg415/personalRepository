spring:
  application:
    name: el-rey-ha-muerto-backend
  config:
    import: optional:classpath:application-local.yml

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/elrey_db}
    username: ${SPRING_DATASOURCE_USERNAME:elrey_user}
    password: ${SPRING_DATASOURCE_PASSWORD:elrey_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: gemini-2.5-flash

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.elrey: DEBUG
    org.springframework.web: INFO

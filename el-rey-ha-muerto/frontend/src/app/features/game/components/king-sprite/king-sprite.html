<div class="king" [class]="'king--' + mood">
  <svg class="king__svg" viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg"
       shape-rendering="crispEdges">

    <!-- Corona -->
    <rect x="18" y="4"  width="4" height="8"  fill="#f0c94a"/>
    <rect x="30" y="2"  width="4" height="10" fill="#f0c94a"/>
    <rect x="42" y="4"  width="4" height="8"  fill="#f0c94a"/>
    <rect x="18" y="12" width="28" height="4" fill="#c9a84c"/>
    <rect x="20" y="6"  width="2"  height="2" fill="#c0392b"/>
    <rect x="32" y="4"  width="2"  height="2" fill="#c0392b"/>
    <rect x="44" y="6"  width="2"  height="2" fill="#c0392b"/>

    <!-- Cabeza -->
    <rect x="16" y="14" width="32" height="26" fill="#f5cba7"/>
    <rect x="14" y="18" width="2"  height="16" fill="#f5cba7"/>
    <rect x="48" y="18" width="2"  height="16" fill="#f5cba7"/>
    <rect x="16" y="12" width="32" height="2"  fill="#f5cba7"/>
    <rect x="16" y="40" width="32" height="2"  fill="#d4a574"/>

    <!-- Ojos (semicirados) -->
    <rect x="22" y="22" width="6" height="4" fill="#2c1810"/>
    <rect x="36" y="22" width="6" height="4" fill="#2c1810"/>
    @if (mood !== 'sleeping' && mood !== 'dead') {
      <rect x="22" y="22" width="6" height="2" fill="#f5cba7"/>
      <rect x="36" y="22" width="6" height="2" fill="#f5cba7"/>
    }

    <!-- Nariz -->
    <rect x="29" y="28" width="4" height="4" fill="#d4a574"/>

    <!-- Boca según mood -->
    @if (mood === 'idle' || mood === 'sleeping') {
      <rect x="24" y="34" width="16" height="2" fill="#2c1810"/>
    }
    @if (mood === 'happy') {
      <rect x="24" y="34" width="2"  height="2" fill="#2c1810"/>
      <rect x="26" y="36" width="12" height="2" fill="#2c1810"/>
      <rect x="38" y="34" width="2"  height="2" fill="#2c1810"/>
    }
    @if (mood === 'worried') {
      <rect x="24" y="36" width="2"  height="2" fill="#2c1810"/>
      <rect x="26" y="34" width="12" height="2" fill="#2c1810"/>
      <rect x="38" y="36" width="2"  height="2" fill="#2c1810"/>
    }
    @if (mood === 'dead') {
      <rect x="26" y="36" width="2" height="2" fill="#2c1810"/>
      <rect x="32" y="34" width="2" height="2" fill="#2c1810"/>
      <rect x="36" y="36" width="2" height="2" fill="#2c1810"/>
      <!-- Ojos X -->
      <rect x="22" y="20" width="6" height="2" fill="#2c1810"/>
      <rect x="22" y="24" width="2" height="2" fill="#2c1810"/>
      <rect x="26" y="24" width="2" height="2" fill="#2c1810"/>
      <rect x="24" y="22" width="2" height="2" fill="#2c1810"/>
      <rect x="36" y="20" width="6" height="2" fill="#2c1810"/>
      <rect x="36" y="24" width="2" height="2" fill="#2c1810"/>
      <rect x="40" y="24" width="2" height="2" fill="#2c1810"/>
      <rect x="38" y="22" width="2" height="2" fill="#2c1810"/>
    }

    <!-- Bigote -->
    <rect x="24" y="32" width="16" height="2" fill="#7a5f1e"/>

    <!-- Cuerpo (pijama a rayas) -->
    <rect x="10" y="42" width="44" height="30" fill="#3a5fa8"/>
    <rect x="10" y="46" width="44" height="2" fill="#2a4f98" opacity="0.6"/>
    <rect x="10" y="52" width="44" height="2" fill="#2a4f98" opacity="0.6"/>
    <rect x="10" y="58" width="44" height="2" fill="#2a4f98" opacity="0.6"/>
    <rect x="10" y="64" width="44" height="2" fill="#2a4f98" opacity="0.6"/>
    <!-- Botones dorados -->
    <rect x="30" y="46" width="4" height="4" fill="#c9a84c"/>
    <rect x="30" y="54" width="4" height="4" fill="#c9a84c"/>
    <rect x="30" y="62" width="4" height="4" fill="#c9a84c"/>

    <!-- Brazos -->
    <rect x="4"  y="44" width="8" height="20" fill="#3a5fa8"/>
    <rect x="52" y="44" width="8" height="20" fill="#3a5fa8"/>
    <rect x="2"  y="62" width="10" height="8" fill="#f5cba7"/>
    <rect x="52" y="62" width="10" height="8" fill="#f5cba7"/>

    <!-- Piernas -->
    <rect x="14" y="72" width="14" height="8" fill="#2a4f98"/>
    <rect x="36" y="72" width="14" height="8" fill="#2a4f98"/>

    <!-- Zapatillas con pompón dorado -->
    <rect x="12" y="78" width="18" height="4" fill="#8b1a1a"/>
    <rect x="34" y="78" width="18" height="4" fill="#8b1a1a"/>
    <rect x="12" y="76" width="4"  height="4" fill="#f0c94a"/>
    <rect x="46" y="76" width="4"  height="4" fill="#f0c94a"/>
  </svg>

  @if (mood === 'sleeping') {
    <div class="king__zzz">
      <span class="z z--1">z</span>
      <span class="z z--2">z</span>
      <span class="z z--3">Z</span>
    </div>
  }

  @if (mood === 'dead') {
    <div class="king__stars">
      <span>★</span><span>☆</span><span>★</span>
    </div>
  }
</div>

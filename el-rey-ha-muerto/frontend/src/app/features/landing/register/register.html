<div class="auth-page">

  <div class="auth-card">

    <div class="auth-card__header">NUEVO LINAJE REAL</div>

    <div class="auth-card__icon">🏰</div>
    <p class="auth-card__sub">Forge your destiny in Paper Crown.</p>

    <div class="auth-form">

      <div class="form-group">
        <label class="form-label">🏛 NOMBRE DEL SOBERANO</label>
        <input
          class="form-input"
          type="text"
          [(ngModel)]="name"
          placeholder="Ej. Rey Arturo"
          autocomplete="name"
          maxlength="20"
        />
      </div>

      <div class="form-group">
        <label class="form-label">✉ CORREO REAL</label>
        <input
          class="form-input"
          type="email"
          [(ngModel)]="email"
          placeholder="cuervo&#64;reino.com"
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label class="form-label">🔑 PALABRA SECRETA</label>
        <input
          class="form-input"
          type="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          autocomplete="new-password"
        />
      </div>

      <button
        class="auth-btn"
        (click)="register()"
        [disabled]="!name.trim() || !email.trim() || !password.trim()">
        🏰 Fundar Reino
      </button>

    </div>

    <p class="auth-card__foot">
      ¿Ya tienes un reino?
      <button class="auth-card__link-inline" (click)="goLogin()">Iniciar Sesión</button>
    </p>

  </div>

</div>

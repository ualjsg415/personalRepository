<div class="auth-page">

  <div class="auth-card">

    @if (!sent) {
      <div class="auth-card__icon">🗝️</div>
      <h2 class="auth-card__title">Buscando la<br>Corona Perdida</h2>
      <p class="auth-card__desc">
        Escribe tu correo real para que los mensajeros te envíen una nueva palabra secreta.
      </p>

      <div class="auth-form">
        <div class="form-group">
          <label class="form-label">CORREO REAL</label>
          <input
            class="form-input"
            type="email"
            [(ngModel)]="email"
            placeholder="tu.nombre&#64;reino.com"
            autocomplete="email"
          />
        </div>

        <button
          class="auth-btn auth-btn--amber"
          (click)="send()"
          [disabled]="!email.trim()">
          ENVIAR MENSAJEROS ➤
        </button>
      </div>

      <hr class="auth-card__sep auth-card__sep--dashed" />
      <button class="auth-card__link" (click)="goBack()">
        ← Volver a las Puertas del Castillo
      </button>
    }

    @if (sent) {
      <div class="auth-card__icon">✉️</div>
      <h2 class="auth-card__title">¡Mensajeros<br>Enviados!</h2>
      <p class="auth-card__desc">
        Si ese correo existe en los archivos reales, recibirás instrucciones en breve.
      </p>
      <button class="auth-btn" (click)="goBack()">
        ← Volver al Castillo
      </button>
    }

  </div>

</div>

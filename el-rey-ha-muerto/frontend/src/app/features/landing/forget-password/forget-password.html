<div class="auth-page">

  <!-- Fondo portrait completo -->
  <img class="auth-page__bg" src="/assets/backgrounds/castle-landscape.png" alt="" />

  <!-- Título difuminado detrás del velo -->
  <header class="auth-page__brand">
    <h1 class="auth-page__title">Paper Crown</h1>
  </header>

  <div class="auth-card">

    <!-- Losa de piedra como fondo del card -->
    <img class="auth-card__scroll" src="/assets/backgrounds/stone-slab.png" alt="" />

    <!-- Corona pixel-art -->
    <svg class="crown-stamp" viewBox="0 0 9 6" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g fill="#7a4a10">
        <rect x="1" y="0" width="1" height="1"/>
        <rect x="4" y="0" width="1" height="1"/>
        <rect x="7" y="0" width="1" height="1"/>
        <rect x="0" y="1" width="2" height="1"/>
        <rect x="3" y="1" width="3" height="1"/>
        <rect x="7" y="1" width="2" height="1"/>
        <rect x="0" y="2" width="9" height="1"/>
        <rect x="0" y="3" width="3" height="1"/>
        <rect x="6" y="3" width="3" height="1"/>
        <rect x="0" y="4" width="9" height="1"/>
        <rect x="1" y="5" width="7" height="1"/>
      </g>
      <rect x="4" y="3" width="1" height="1" fill="#d4a020"/>
      <rect x="3" y="3" width="1" height="1" fill="#a07018" opacity="0.7"/>
      <rect x="5" y="3" width="1" height="1" fill="#a07018" opacity="0.7"/>
    </svg>

    @if (!sent) {
      <h1 class="auth-card__title">Corona<br>Perdida</h1>
      
      <p class="auth-card__desc">
        Escribe tu correo real para que los mensajeros te envíen una nueva palabra secreta.
      </p>

      <div class="auth-form">
        <div class="form-group">
          <label class="form-label"> Correo Real</label>
          <input
            class="form-input"
            type="email"
            [(ngModel)]="email"
            placeholder="tu.nombre&#64;reino.com"
            autocomplete="email"
          />
        </div>

        <button
          class="auth-btn"
          (click)="send()"
          [disabled]="!email.trim()">
          Enviar Mensajeros ➵
        </button>
      </div>

      
      <button class="auth-card__link" (click)="goBack()">
         Volver al Castillo
      </button>
    }

    @if (sent) {
      <h1 class="auth-card__title">¡Mensajeros<br>Enviados!</h1>
      <p class="auth-card__desc">
        Si ese correo existe en los archivos reales, recibirás instrucciones en breve.
      </p>
      <button class="auth-btn" (click)="goBack()">
        ← Volver al Castillo
      </button>
    }

  </div>

</div>

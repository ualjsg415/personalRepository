<div class="home-screen">

  <img class="home-screen__bg" src="/assets/backgrounds/castle-landscape.png" alt="" />
  <div class="home-screen__dim" aria-hidden="true"></div>

  <!-- Título dentro del recuadro del banner -->
  <header class="home-screen__brand">
    <h1 class="home-screen__title">Paper Crown</h1>
  </header>

  <!-- Cartel de madera (imagen PNG) con botones superpuestos -->
  <div class="board">
    <img class="board__img" src="/assets/backgrounds/board.png" alt="Cartel de madera" />

    <!-- Placa superior izquierda → Iniciar Sesión -->
    <button class="board__btn board__btn--1" (click)="play()">
      INICIAR<br>SESIÓN
    </button>

    <!-- Placa derecha centro → Registrarse -->
    <button class="board__btn board__btn--2" (click)="goToRegister()">
      REGISTRARSE
    </button>

    <!-- Placa inferior grande → Archivos Reales -->
    <button class="board__btn board__btn--3" (click)="history()">
      ARCHIVOS<br>REALES
    </button>
  </div>

  <!-- Botón "Cómo Jugar" — medallón pixel art con ! -->
  <button class="htp-coin" (click)="toggleHowToPlay()" aria-label="Cómo jugar">
    <svg class="htp-coin__svg" viewBox="0 0 24 24"
         xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
      <!-- Sombra / borde oscuro -->
      <rect x="6"  y="1"  width="12" height="2"  fill="#7a5010"/>
      <rect x="3"  y="2"  width="3"  height="2"  fill="#7a5010"/>
      <rect x="18" y="2"  width="3"  height="2"  fill="#7a5010"/>
      <rect x="1"  y="4"  width="2"  height="16" fill="#7a5010"/>
      <rect x="21" y="4"  width="2"  height="16" fill="#7a5010"/>
      <rect x="3"  y="20" width="3"  height="2"  fill="#7a5010"/>
      <rect x="18" y="20" width="3"  height="2"  fill="#7a5010"/>
      <rect x="6"  y="21" width="12" height="2"  fill="#7a5010"/>
      <!-- Relleno dorado -->
      <rect x="6"  y="2"  width="12" height="1"  fill="#c9a84c"/>
      <rect x="3"  y="3"  width="18" height="1"  fill="#c9a84c"/>
      <rect x="2"  y="4"  width="20" height="16" fill="#d4af4c"/>
      <rect x="3"  y="20" width="18" height="1"  fill="#c9a84c"/>
      <rect x="6"  y="21" width="12" height="1"  fill="#a07830"/>
      <!-- Highlight arriba-izquierda -->
      <rect x="6"  y="2"  width="6"  height="1"  fill="#f0d060"/>
      <rect x="3"  y="3"  width="6"  height="1"  fill="#f0d060"/>
      <rect x="2"  y="4"  width="5"  height="4"  fill="#f0d060"/>
      <!-- Signo ! -->
      <rect x="11" y="6"  width="2"  height="7"  fill="#1a0c04"/>
      <rect x="11" y="15" width="2"  height="3"  fill="#1a0c04"/>
    </svg>
  </button>

  <!-- Panel de instrucciones (componente standalone) -->
  @if (showHowToPlay) {
    <app-how-to-play (closed)="toggleHowToPlay()"></app-how-to-play>
  }

</div>

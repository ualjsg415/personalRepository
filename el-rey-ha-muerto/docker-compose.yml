version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: elrey-postgres
    environment:
      POSTGRES_DB: elrey_db
      POSTGRES_USER: elrey_user
      POSTGRES_PASSWORD: elrey_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - elrey-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elrey_user -d elrey_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: elrey-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/elrey_db
      SPRING_DATASOURCE_USERNAME: elrey_user
      SPRING_DATASOURCE_PASSWORD: elrey_pass
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - elrey-network

  frontend:
    build: ./frontend
    container_name: elrey-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - elrey-network

volumes:
  postgres_data:

networks:
  elrey-network:
    driver: bridge
